<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background Sprite</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #101820;
    }

    canvas {
      width: min(768px, 90vw);
      height: auto;
      image-rendering: pixelated;
    }
  </style>
  <script src="entities.js" defer></script>
</head>
<body>
  <canvas id="background" width="256" height="128" aria-label="Animated background with an idle player sprite"></canvas>
</body>
</html>
